<!DOCTYPE html>
<html>
<head>
    <title>ATM Machine</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f0f4f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.atm {
    background-color: #ffffff;
    padding: 20px;
    border: 2px solid #0077b6;
    border-radius: 8px;
    text-align: center;
    width: 400px;
    height: 250px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.atm h1 {
    color: #0077b6;
}

.atm input {
    width: 90%;
    padding: 8px;
    margin: 10px 0;
    border: 1px solid #0077b6;
    border-radius: 4px;
}

.atm button {
    background-color: #0077b6;
    color: white;
    border: none;
    padding: 15px 55px;
    margin: 5px;
    border-radius: 4px;
    cursor: pointer;
}

.atm button:hover {
    background-color: #026c8a;
}
/* Full screen dark background overlay */
.popup-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.7); /* Dim effect */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000; /* Keeps it on top */
}

/* White box holding the image */
.popup-content {
  background: white;
  padding: 20px;
  border-radius: 8px;
  position: relative;
  max-width: 80%;
}

/* Close button (X) */
.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 24px;
  cursor: pointer;
}


#message {
    margin-top: 10px;
    font-weight: bold;
    color: #333;
}

    
    
    </style> 
</head>
<body>
    <div class="atm">
        <h1>ATM Machine</h1>
        <p>Current Balance: ₹<span id="balance">5000</span></p>
        <input type="number" id="amount" placeholder="Enter Amount">
        <br><br>
        <button onclick="deposit()">Deposit</button>
        <button onclick="withdraw()">Withdraw</button>
        <p id="message"></p>
        <!-- The Popup Overlay -->

    <script>
        let balance = 5000;

        function deposit() {
            let amount = Number(document.getElementById("amount").value);
            if (amount > 0&&amount<100000) {
                balance = balance + amount;
                document.getElementById("balance").innerText = balance;
                document.getElementById("message").innerText = "₹" + amount + " deposited successfully!";
            } else if (amount>100000) {
                document.getElementById('message').innerText = "HOSH ME AO ABHIJEET";
                // Show the popup overlay
                document.getElementById('image-popup').style.display = 'flex';
            } else {
                document.getElementById("message").innerText = "Enter a valid amount to deposit.";
            }
        }

        // Function to close the popup when 'X' is clicked
        function closePopup() {
            document.getElementById('image-popup').style.display = 'none';
        }

        function withdraw() {
            let amount = Number(document.getElementById("amount").value);
            if (amount > 0 && amount <= balance) {
                balance = balance - amount;
                document.getElementById("balance").innerText = balance;
                document.getElementById("message").innerText = "₹" + amount + " withdrawn successfully!";
            } else if (amount > balance) {
                document.getElementById("message").innerText = "Insufficient balance!";
            } else {
                document.getElementById("message").innerText = "Enter a valid amount to withdraw.";
            }
        }
    </script>
